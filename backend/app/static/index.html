<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalEase • Contract & Clause Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(30, 41, 59, 0.8);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // API Helpers
    const api = {
      getOverview: () => fetch('/api/v1/analytics/overview').then(r => r.json()),
      getMatters: (params = {}) => {
        const q = new URLSearchParams(params);
        return fetch(`/api/v1/matters/?${q}`).then(r => r.json());
      },
      createMatter: (data) => fetch('/api/v1/matters/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(r => r.json()),
      getDocuments: (params = {}) => {
        const q = new URLSearchParams(params);
        return fetch(`/api/v1/documents/?${q}`).then(r => r.json());
      },
      getDocument: (id) => fetch(`/api/v1/documents/${id}`).then(r => r.json()),
      createDocument: (data) => fetch('/api/v1/documents/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(r => r.json()),
      analyzeDocument: (id) => fetch(`/api/v1/documents/${id}/analyze`, { method: 'POST' }).then(r => r.json()),
      getClauses: (docId) => fetch(`/api/v1/clauses/document/${docId}`).then(r => r.json()),
      updateClause: (id, data) => fetch(`/api/v1/clauses/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(r => r.json()),
      getAuditLogs: () => fetch('/api/v1/analytics/audit-logs').then(r => r.json()),
    };

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function formatDate(str) {
      if (!str) return '';
      return new Date(str).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Risk Badge Component
    function RiskBadge({ level, size = 'sm' }) {
      const norm = (level || '').toUpperCase();
      let styles = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700';
      let dotColor = 'bg-slate-400';
      let label = level;

      if (norm === 'PASS' || norm === 'LOW') {
        styles = 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-400 dark:border-emerald-800/60';
        dotColor = 'bg-emerald-500';
        label = norm === 'PASS' ? 'Standard Pass' : 'Low Risk';
      } else if (norm === 'ATTENTION' || norm === 'MEDIUM') {
        styles = 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-800/60';
        dotColor = 'bg-amber-500';
        label = norm === 'ATTENTION' ? 'Needs Attention' : 'Medium Risk';
      } else if (norm === 'HIGH_RISK' || norm === 'HIGH' || norm === 'CRITICAL') {
        styles = 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/40 dark:text-rose-400 dark:border-rose-800/60';
        dotColor = 'bg-rose-500';
        label = norm === 'CRITICAL' ? 'Critical Risk' : 'High Risk';
      }

      const sizeCls = size === 'sm' ? 'text-xs px-2.5 py-0.5' : 'text-sm px-3.5 py-1';

      return (
        <span className={`inline-flex items-center gap-1.5 font-medium rounded-full border ${styles} ${sizeCls}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dotColor}`}></span>
          {label}
        </span>
      );
    }

    // Main App
    function App() {
      const [currentView, setCurrentView] = useState('dashboard'); // dashboard | matters | documents | workspace | playback
      const [selectedDocId, setSelectedDocId] = useState(null);
      const [isDark, setIsDark] = useState(false);
      const [loading, setLoading] = useState(true);

      // Data States
      const [analytics, setAnalytics] = useState(null);
      const [matters, setMatters] = useState([]);
      const [documents, setDocuments] = useState([]);
      const [activeWorkspaceDoc, setActiveWorkspaceDoc] = useState(null);
      const [workspaceClauses, setWorkspaceClauses] = useState([]);
      const [activeClauseFilter, setActiveClauseFilter] = useState('ALL');
      const [analyzingDoc, setAnalyzingDoc] = useState(false);

      // Modals
      const [isNewMatterOpen, setIsNewMatterOpen] = useState(false);
      const [isUploadDocOpen, setIsUploadDocOpen] = useState(false);
      const [newMatterForm, setNewMatterForm] = useState({ title: '', client_name: '', practice_area: 'Corporate' });
      const [newDocForm, setNewDocForm] = useState({ title: '', matter_id: '' });

      // Filters
      const [matterFilterArea, setMatterFilterArea] = useState('ALL');
      const [docRiskFilter, setDocRiskFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const toggleTheme = () => {
        setIsDark(!isDark);
        if (!isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      const loadInitialData = async () => {
        setLoading(true);
        try {
          const [an, mats, docs] = await Promise.all([
            api.getOverview(),
            api.getMatters(),
            api.getDocuments()
          ]);
          setAnalytics(an);
          setMatters(mats);
          setDocuments(docs);
          if (mats.length > 0 && !newDocForm.matter_id) {
            setNewDocForm(prev => ({ ...prev, matter_id: mats[0].id }));
          }
        } catch (e) {
          console.error('Failed to load initial data:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadInitialData();
      }, []);

      const openWorkspace = async (docId) => {
        setSelectedDocId(docId);
        setCurrentView('workspace');
        setLoading(true);
        try {
          const [doc, cls] = await Promise.all([
            api.getDocument(docId),
            api.getClauses(docId)
          ]);
          setActiveWorkspaceDoc(doc);
          setWorkspaceClauses(cls);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handleTriggerAIScan = async () => {
        if (!selectedDocId) return;
        setAnalyzingDoc(true);
        try {
          const updated = await api.analyzeDocument(selectedDocId);
          const updatedClauses = await api.getClauses(selectedDocId);
          setActiveWorkspaceDoc(updated);
          setWorkspaceClauses(updatedClauses);
          // Refresh global analytics and docs in background
          api.getOverview().then(setAnalytics);
          api.getDocuments().then(setDocuments);
        } catch (e) {
          console.error('AI Scan Error:', e);
        } finally {
          setAnalyzingDoc(false);
        }
      };

      const handleCreateMatter = async (e) => {
        e.preventDefault();
        try {
          await api.createMatter(newMatterForm);
          setIsNewMatterOpen(false);
          setNewMatterForm({ title: '', client_name: '', practice_area: 'Corporate' });
          const [mats, an] = await Promise.all([api.getMatters(), api.getOverview()]);
          setMatters(mats);
          setAnalytics(an);
        } catch (err) {
          console.error(err);
        }
      };

      const handleUploadDoc = async (e) => {
        e.preventDefault();
        try {
          const created = await api.createDocument({
            ...newDocForm,
            file_type: 'PDF',
            file_size_bytes: 2350000,
            risk_level: 'LOW',
            risk_score: 25.0,
            status: 'INGESTED',
            summary: 'Newly ingested contract ready for automated AI risk evaluation.'
          });
          setIsUploadDocOpen(false);
          setNewDocForm(prev => ({ ...prev, title: '' }));
          const [docs, an] = await Promise.all([api.getDocuments(), api.getOverview()]);
          setDocuments(docs);
          setAnalytics(an);
          openWorkspace(created.id);
        } catch (err) {
          console.error(err);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Navigation */}
          <header className="sticky top-0 z-30 flex h-16 w-full items-center justify-between border-b border-slate-200/80 bg-white/90 px-6 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/90">
            <div className="flex items-center gap-6">
              <button onClick={() => setCurrentView('dashboard')} className="flex items-center gap-2.5 text-left">
                <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white shadow-sm shadow-indigo-500/25">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
                </div>
                <div>
                  <span className="font-bold text-slate-900 dark:text-white tracking-tight text-lg">
                    Legal<span className="text-indigo-600 dark:text-indigo-400">Ease</span>
                  </span>
                  <span className="hidden sm:inline-block ml-2 text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400">
                    Live UI
                  </span>
                </div>
              </button>

              <div className="relative hidden md:block w-72">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Quick filter across contracts..."
                  className="w-full rounded-lg border border-slate-200 bg-slate-50/80 py-1.5 pl-4 pr-3 text-xs text-slate-800 focus:border-indigo-500 focus:bg-white focus:outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200"
                />
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setIsUploadDocOpen(true)}
                className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/60 shadow-xs transition-colors"
              >
                + Ingest Contract
              </button>
              <button
                onClick={() => setIsNewMatterOpen(true)}
                className="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm shadow-indigo-600/20 transition-all"
              >
                + New Matter
              </button>

              <button
                onClick={toggleTheme}
                className="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                title="Toggle Theme"
              >
                {isDark ? '☀️' : '🌙'}
              </button>

              <div className="flex items-center gap-2 pl-2 border-l border-slate-200 dark:border-slate-800">
                <div className="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold">
                  EV
                </div>
                <div className="hidden lg:block text-left text-xs">
                  <p className="font-semibold text-slate-800 dark:text-slate-200 leading-tight">Eleanor Vance</p>
                  <p className="text-[10px] text-slate-500">Partner &bull; M&A</p>
                </div>
              </div>
            </div>
          </header>

          <div className="flex flex-1">
            {/* Sidebar */}
            <aside className="w-60 border-r border-slate-200/80 bg-white/60 dark:border-slate-800 dark:bg-slate-900/60 p-4 flex flex-col justify-between shrink-0">
              <div className="space-y-6">
                <div>
                  <p className="px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">
                    Intelligence Console
                  </p>
                  <nav className="space-y-1">
                    {[
                      { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                      { id: 'matters', label: 'Legal Matters', icon: '⚖️' },
                      { id: 'documents', label: 'Document Vault', icon: '📁' },
                      { id: 'playback', label: 'Activity Playback', icon: '⚡' },
                    ].map((item) => (
                      <button
                        key={item.id}
                        onClick={() => {
                          setCurrentView(item.id);
                          if (item.id === 'documents') setSelectedDocId(null);
                        }}
                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
                          currentView === item.id
                            ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold'
                            : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100/70 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800/60'
                        }`}
                      >
                        <span className="text-base">{item.icon}</span>
                        <span>{item.label}</span>
                      </button>
                    ))}
                  </nav>
                </div>

                <div className="rounded-xl border border-slate-200/80 dark:border-slate-800 bg-gradient-to-br from-slate-50 to-indigo-50/40 dark:from-slate-900 dark:to-indigo-950/20 p-3.5">
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span className="text-xs font-semibold text-slate-800 dark:text-slate-200">
                      SQLite 3 WAL Engine
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                    Zero-latency local database storage. High concurrency enabled.
                  </p>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-400 flex justify-between items-center">
                <span>FastAPI + React</span>
                <span className="font-mono text-[10px] text-emerald-600 dark:text-emerald-400">ONLINE</span>
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 p-6 md:p-8 max-w-7xl mx-auto w-full overflow-y-auto">
              {loading && !activeWorkspaceDoc ? (
                <div className="flex h-96 items-center justify-center">
                  <div className="flex flex-col items-center gap-3">
                    <div className="w-8 h-8 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="text-xs font-medium text-slate-400">Connecting to Legal Intelligence Core...</p>
                  </div>
                </div>
              ) : (
                <>
                  {/* VIEW 1: DASHBOARD */}
                  {currentView === 'dashboard' && (
                    <div className="space-y-8">
                      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-2 border-b border-slate-200/80 dark:border-slate-800">
                        <div>
                          <h1 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                            Contract Intelligence Center
                          </h1>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                            Real-time contract risk evaluation, practice analytics, and audit tracking.
                          </p>
                        </div>
                        <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-400 border border-indigo-200/60 dark:border-indigo-800/60">
                          ✨ AI Engine Operational
                        </span>
                      </div>

                      {/* KPI Cards */}
                      {analytics && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                          {[
                            { title: 'Active Matters', val: analytics.active_matters, sub: `${analytics.total_matters} total matters registered`, color: 'text-indigo-600', icon: '⚖️' },
                            { title: 'Analyzed Contracts', val: analytics.analyzed_documents, sub: `${analytics.total_documents} contracts in vault`, color: 'text-blue-600', icon: '📄' },
                            { title: 'High-Risk Clauses', val: analytics.high_risk_clauses, sub: 'Requires immediate partner review', color: 'text-rose-600', icon: '⚠️' },
                            { title: 'Firm Compliance Score', val: `${analytics.compliance_score}%`, sub: 'Benchmark target > 85%', color: 'text-emerald-600', icon: '🛡️' },
                          ].map(k => (
                            <div key={k.title} className="rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-xs">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">{k.title}</span>
                                <span className="text-lg">{k.icon}</span>
                              </div>
                              <div className="mt-3">
                                <span className="text-2xl font-bold text-slate-900 dark:text-white">{k.val}</span>
                                <p className="mt-1 text-xs text-slate-400">{k.sub}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Risk Breakdown + Audit Trail */}
                      {analytics && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                          <div className="lg:col-span-2 rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 shadow-xs">
                            <h3 className="text-sm font-semibold text-slate-900 dark:text-white mb-1">
                              Contract Risk Exposure Breakdown
                            </h3>
                            <p className="text-xs text-slate-400 mb-5">
                              Distribution across {documents.length} ingested contract documents
                            </p>

                            {/* Progress bar */}
                            <div className="h-3 w-full rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden flex gap-1 p-0.5 mb-6">
                              <div style={{ width: `${(analytics.risk_distribution.low / (documents.length || 1)) * 100}%` }} className="h-full bg-emerald-500 rounded-full" title="Low Risk"></div>
                              <div style={{ width: `${(analytics.risk_distribution.medium / (documents.length || 1)) * 100}%` }} className="h-full bg-amber-500 rounded-full" title="Medium Risk"></div>
                              <div style={{ width: `${(analytics.risk_distribution.high / (documents.length || 1)) * 100}%` }} className="h-full bg-rose-500 rounded-full" title="High Risk"></div>
                              <div style={{ width: `${(analytics.risk_distribution.critical / (documents.length || 1)) * 100}%` }} className="h-full bg-purple-600 rounded-full" title="Critical Risk"></div>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                              {[
                                { label: 'Low Risk', count: analytics.risk_distribution.low, dot: 'bg-emerald-500' },
                                { label: 'Medium Risk', count: analytics.risk_distribution.medium, dot: 'bg-amber-500' },
                                { label: 'High Risk', count: analytics.risk_distribution.high, dot: 'bg-rose-500' },
                                { label: 'Critical Risk', count: analytics.risk_distribution.critical, dot: 'bg-purple-600' },
                              ].map(s => (
                                <div key={s.label} className="p-3 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30">
                                  <div className="flex items-center gap-1.5 mb-1">
                                    <span className={`w-2 h-2 rounded-full ${s.dot}`}></span>
                                    <span className="text-xs text-slate-500 dark:text-slate-400">{s.label}</span>
                                  </div>
                                  <span className="text-lg font-bold text-slate-900 dark:text-white">{s.count}</span>
                                </div>
                              ))}
                            </div>
                          </div>

                          <div className="rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 shadow-xs">
                            <h3 className="text-sm font-semibold text-slate-900 dark:text-white mb-3">
                              Real-Time Audit Stream
                            </h3>
                            <div className="space-y-3">
                              {analytics.recent_activity.slice(0, 5).map(act => (
                                <div key={act.id} className="p-2.5 rounded-lg border border-slate-100 dark:border-slate-800 bg-slate-50/40 dark:bg-slate-800/20 text-xs">
                                  <div className="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                                    <span className="font-semibold text-indigo-600 dark:text-indigo-400">{act.action}</span>
                                    <span>{formatDate(act.timestamp)}</span>
                                  </div>
                                  <p className="font-medium text-slate-800 dark:text-slate-200 truncate">{act.document_title}</p>
                                  <p className="text-[11px] text-slate-500">{act.user_name}</p>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Recent Contracts Table */}
                      <div className="rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-hidden shadow-xs">
                        <div className="p-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                          <div>
                            <h3 className="text-sm font-semibold text-slate-900 dark:text-white">Active Contracts Under Analysis</h3>
                            <p className="text-xs text-slate-400">Click any document to inspect clauses and simulate AI review</p>
                          </div>

                      required
                      value={newMatterForm.client_name}
                      onChange={e => setNewMatterForm({ ...newMatterForm, client_name: e.target.value })}
                      placeholder="e.g. Acme Corporation"
                      className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:border-indigo-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Practice Area</label>
                    <select
                      value={newMatterForm.practice_area}
                      onChange={e => setNewMatterForm({ ...newMatterForm, practice_area: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:border-indigo-500 focus:outline-none"
                    >
                      <option value="Corporate">Corporate & Governance</option>
                      <option value="M&A">Mergers & Acquisitions (M&A)</option>
                      <option value="IP & Tech">IP & Technology Licensing</option>
                      <option value="Commercial">Commercial Contracting</option>
                      <option value="Compliance">Regulatory & Compliance</option>
                      <option value="Employment">Employment Law</option>
                    </select>
                  </div>
                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNewMatterOpen(false)} className="px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                    <button type="submit" className="px-4 py-2 font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Create Matter</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Upload Document */}
          {isUploadDocOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl border border-slate-200 dark:border-slate-800 dark:bg-slate-900">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-semibold text-base">Ingest Contract to Vault</h3>
                  <button onClick={() => setIsUploadDocOpen(false)} className="text-slate-400 hover:text-slate-600">&times;</button>
                </div>
                <form onSubmit={handleUploadDoc} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold mb-1">Contract Title</label>
                    <input
                      type="text"
                      required
                      value={newDocForm.title}
                      onChange={e => setNewDocForm({ ...newDocForm, title: e.target.value })}
                      placeholder="e.g. Master Services Agreement (v2.0)"
                      className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:border-indigo-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Assign to Matter</label>
                    <select
                      value={newDocForm.matter_id}
                      onChange={e => setNewDocForm({ ...newDocForm, matter_id: e.target.value })}
                      className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:border-indigo-500 focus:outline-none"
                    >
                      {matters.map(m => (
                        <option key={m.id} value={m.id}>{m.title} ({m.client_name})</option>
                      ))}
                    </select>
                  </div>
                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsUploadDocOpen(false)} className="px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                    <button type="submit" className="px-4 py-2 font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Ingest Document</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
